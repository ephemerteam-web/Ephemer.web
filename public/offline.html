<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hors ligne — Ephemer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; padding: 24px;
      background: #faf9f7; color: #2d2d2d; text-align: center;
    }
    .box { max-width: 380px; }
    h1 { font-size: 1.4rem; margin-bottom: 12px; }
    p { line-height: 1.6; color: #666; font-size: 0.95rem; }
    button {
      margin-top: 24px; padding: 12px 28px; font-size: 1rem;
      border: none; border-radius: 8px; background: #4f46e5;
      color: white; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <div style="font-size:3rem">📡</div>
    <h1>Pas de connexion</h1>
    <p>Ephemer a besoin d'internet pour afficher tes contacts et tes rappels. Vérifie ta connexion puis réessaie.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
